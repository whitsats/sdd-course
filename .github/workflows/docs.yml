name: docs

# 推送到 main 时重建讲义站点，部署到 GitHub Pages。
# 只碰站点的内容源才触发 —— 改 examples/ 里的代码本身不该重发站点。
on:
  push:
    branches: [main]
    paths:
      - "lessons/**"
      - "reference/**"
      - "projects/**"
      - "templates/**"
      - "examples/**/*.md"
      - "scripts/**"
      - "README.md"
      - "PLAN.md"
      - "zensical.toml"
      - "requirements-docs.txt"
      - "tools/build_site.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# 部署 Pages 需要这三个权限，缺一不可
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署在跑，但不要打断正在进行的部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ⚠️ enablement: true 不是可选项，是必需的。
      #    本仓库的第一次构建就死在这里（6 秒即失败）：
      #      [error] Get Pages site failed. Please verify that the repository has
      #      Pages enabled and configured to build using GitHub Actions
      #   原因：推送那一刻 Pages 尚未启用（我是用 API 事后启用的，Concurrent 竞态），
      #   而不带 enablement 的 configure-pages 遇到没启用的仓库就直接报错退出。
      #   加上它会自己把 Pages 建起来 —— 后续任何人克隆这个模板都不用先去点设置。
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/checkout@v7

      # ⚠️ 这里是精确版本，不是 @v10 —— 该 action 不发布浮动的主版本标签
      # （标签只有 v10.2.0 / v10.1.0 … 和少数两段式如 v7.6），写成 @v10 会直接
      # 报 “Unable to resolve action … unable to find version v10”。实测踩过。
      - name: 安装 uv（为了拿到 uvx）
        uses: astral-sh/setup-uv@v10.2.0

      # 纯标准库脚本，用 runner 自带的 python3 跑就够，不必装任何依赖。
      # 它同时是站点的第一道门禁：相对链接解析不了会在这里 exit 1，
      # 而不是等到 zensical 报一句看不懂的 “not found in the documentation files”。
      - name: 拼装站点源文件
        run: python3 tools/build_site.py

      # zensical 装在 uvx 的隔离环境里，不会往 runner 上装一堆无关的包。
      # --strict：把失效链接、游离页面（存在但不在 nav 里）都当成错误。
      # 讲义改了标题忘了改导航、或新增页面忘了挂进 zensical.toml，构建直接红。
      - name: 构建站点
        run: uvx --with-requirements requirements-docs.txt zensical build --strict --clean

      # 上线前的最后一道闸：折叠块里的 markdown 真的被解析了吗。
      # 这一条踩过的坑是「构建 ✅ 通过 → 产物 ✅ 生成 → CI ✅ 全绿 →
      # 页面上是一整块没格式的文本」—— 构建链上没有任何环节会报警。
      # 放在 upload 之前，坏页面就不会被发布出去。
      - name: 渲染完整性（折叠块）
        run: bash scripts/check-rendering.sh --site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
