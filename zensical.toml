[project.theme]
# classic = 保留 Material for MkDocs 的外观（Zensical 自带的主题变体）
variant = "classic"
language = "zh"
features = [
  "navigation.tracking",
  "navigation.top",
  "navigation.footer",
  "navigation.instant",
  "content.code.copy",
  "content.tooltips",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切到深色"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "切到浅色"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight = {}
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tasklist.custom_checkbox = true
