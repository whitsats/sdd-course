# 讲义站点（GitHub Pages）
#
# 生成器用 Zensical —— Material for MkDocs 的官方继任者（同一团队，squidfunk）。
# 换掉 mkdocs-material 的原因：它已定于 2026-11-05 EOL，9.7.0 是最后一版；
# 底层 MkDocs 1.x 自 2024 年 8 月起无人维护；且 MkDocs 2.0 明确「没有迁移路径」。
#
# docs_dir 指向 site-src/ —— 那是构建时拼出来的临时目录，不是仓库里的源文件。
# 所以动手前必须先跑拼装脚本：
#
#   python tools/build_site.py
#   uvx --with-requirements requirements-docs.txt zensical serve          # 本地预览
#   uvx --with-requirements requirements-docs.txt zensical build --strict --clean
#
# ⚠️ docs_dir 不能写成点开头的目录（如 .site-src）：Zensical 会跳过隐藏目录，
#    结果构建「成功」、产出 0 页、而且一句警告都不报。实测踩过，别改回去。
#
# CI 在推送到 main 时做同样的事并部署，见 .github/workflows/docs.yml。

[project]
site_name = "SDD 实战精修课"
site_description = "从 vibe coding 到规格驱动 —— 15 节讲义 + 5 个递进案例 + 全部真实产物"
site_url = "https://whitsats.github.io/sdd-course/"
repo_url = "https://github.com/whitsats/sdd-course"
repo_name = "whitsats/sdd-course"

docs_dir = "site-src"
site_dir = "site-out"

# ⚠️ 导航必须覆盖 site-src/ 里的每一页。漏掉的页面会触发
#    「exists in the docs directory, but is not included in the nav」警告，
#    在 --strict 下就是构建失败 —— 这条约束是有意的：它保证没有页面成为孤岛。
nav = [
  { "开始" = "index.md" },
  { "学习计划（时间与取舍）" = "plan.md" },
  { "一 · 心智模型（先想清楚，再动手）" = [
      { "00 环境准备与首次空跑" = "lessons/00-setup.md" },
      { "01 为什么是 SDD ★" = "lessons/01-why-sdd.md" },
      { "02 Constitution：给项目立宪" = "lessons/02-constitution.md" },
  ] },
  { "二 · 项目 A focuslog（spec-first）" = [
      { "03 Specify：把意图写成规格" = "lessons/03-specify.md" },
      { "04 Plan & Tasks：方案与原子拆解" = "lessons/04-plan-tasks.md" },
      { "05 Implement 与手工验收 ★" = "lessons/05-implement.md" },
  ] },
  { "三 · 项目 B taskflow（spec-anchored）" = [
      { "06 Clarify & Checklist：把歧义清零" = "lessons/06-clarify-checklist.md" },
      { "07 架构与契约规格：让 plan 有牙齿 ★" = "lessons/07-architecture-contracts.md" },
      { "08 Analyze 与分批实现" = "lessons/08-analyze-implement.md" },
      { "09 Converge 与漂移治理 ★" = "lessons/09-converge-drift.md" },
  ] },
  { "四 · 项目 C rulesmith（spec-as-source）" = [
