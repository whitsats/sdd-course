  ] },
  { "五 · 落地" = [
      { "11 存量改造：给已有仓库补规格" = "lessons/11-brownfield.md" },
      { "12 团队化落地与生态选型" = "lessons/12-team-rollout.md" },
  ] },
  { "六 · 可选进阶（Java · 约束前移）" = [
